# Tuned for an 8 GB single-VPS deployment sharing memory with app containers.
listen_addresses = '*'
# Two API workers and three job workers each keep a SQLAlchemy pool (10 + 10 overflow) plus a
# procrastinate connection; 80 was reachable under load.
max_connections = 160
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 32MB
maintenance_work_mem = 256MB
wal_level = replica
max_wal_size = 2GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 1000

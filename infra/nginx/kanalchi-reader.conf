# Host nginx site for the reader-only stack (infra/compose.reader.yml).
# Installed as /etc/nginx/sites-available/zz-kanalchi and symlinked into sites-enabled. The zz-
# prefix loads it after the droplet's other site, which therefore stays the default server.
# TLS: certbot issued `the-bakiroo.uz` (both names) and renews it with its own timer.

# Per-IP limits. A page render costs several API calls, so pages are limited harder than the
# API. Bursts cover a normal visit; a client fanning out dozens of renders gets 429s.
limit_req_zone  $binary_remote_addr zone=kanalchi_pages:10m rate=4r/s;
limit_req_zone  $binary_remote_addr zone=kanalchi_api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=kanalchi_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name the-bakiroo.uz www.the-bakiroo.uz;
    return 301 https://the-bakiroo.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.the-bakiroo.uz;
    ssl_certificate /etc/letsencrypt/live/the-bakiroo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-bakiroo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://the-bakiroo.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name the-bakiroo.uz;
    ssl_certificate /etc/letsencrypt/live/the-bakiroo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-bakiroo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;
    limit_conn kanalchi_conn 20;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API resolves the tenant from Host. X-Tenant-Host is only ever set by the web
    # server's own calls, so it is dropped here.
    location /api/ {
        limit_req zone=kanalchi_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream as server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /tg/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Post media (public bucket) and studio uploads (presigned). The internal Host keeps
    # presigned signatures valid.
    location /media/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host minio:9000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host minio:9000;
    }

    # Hashed build assets: never rate-limited, cached for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=kanalchi_pages burst=30 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Host nginx site for the reader-only stack (infra/compose.reader.yml).
# Installed as /etc/nginx/sites-available/kanalchi and symlinked into sites-enabled.
# certbot --nginx adds the 443 server block and the HTTP→HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name the-bakiroo.uz www.the-bakiroo.uz;

    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API resolves the tenant from Host. X-Tenant-Host is only ever set by the web
    # server's own calls, so it is dropped here.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream as server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /tg/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Post media (public bucket) and studio uploads (presigned). The internal Host keeps
    # presigned signatures valid.
    location /media/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host minio:9000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host minio:9000;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

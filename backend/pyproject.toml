[project]
name = "kanalchi"
version = "0.1.0"
description = "AI helper for Telegram bloggers: indexed web blog, auto-taxonomy, grounded chat, publishing studio"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "procrastinate[psycopg]>=3.9",
  "redis>=5.0",
  "telethon>=1.45,<2",
  "aiogram>=3.31,<4",
  "anthropic>=1.0",
  "voyageai>=0.3",
  "aioboto3>=13.0",
  "pillow>=10.3",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "structlog>=24.1",
  "typer>=0.12",
  "tldextract>=5.1",
  "orjson>=3.10",
  "httpx>=0.27",
  "dnspython>=2.6",
]

[project.scripts]
kanalchi = "kanalchi.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanalchi"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

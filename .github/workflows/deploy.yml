name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one rather than cancelling it
# half-way through a migration.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      # Database-backed tests skip themselves when no dev database is reachable.
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: [backend, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        # Built here rather than on the droplet, which is too small to run a Next.js build
        # next to the apps it serves.
        run: |
          docker build -t kanalchi/backend:latest backend
          docker build -t kanalchi/web:latest web
      - name: Ship images and deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY is not set yet; skipping deploy (see README → Auto-deploy)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned host key: a changed key fails the deploy instead of trusting a stranger.
          echo '161.35.79.4 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINc5GRfiwBGzJ/O/XsucbK0N/6AFkqsLbDShRr0ahuVX' > ~/.ssh/known_hosts
          # The key is installed with a forced command, so this can only run deploy.sh.
          docker save kanalchi/backend:latest kanalchi/web:latest | gzip -1 | \
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
              root@161.35.79.4 "load ${{ github.sha }}"
